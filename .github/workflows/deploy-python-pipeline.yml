name: Deploy Python AWS resources

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project name
        required: true
        default: sri
        type: string
      environment:
        description: Deployment environment
        required: true
        default: dev
        type: string
      region:
        description: AWS region
        required: true
        default: us-east-1
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-python-${{ inputs.project }}-${{ inputs.environment }}-${{ inputs.region }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy AWS resources
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      ADDITIONAL_RDS_SECURITY_GROUP_IDS: ${{ secrets.ADDITIONAL_RDS_SECURITY_GROUP_IDS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r python-programming/requirements.txt

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.region }}

      - name: Deploy Python AWS resources
        run: >-
          python python-programming/deploy-awsresources.py
          "${{ inputs.project }}"
          "${{ inputs.environment }}"
          "${{ inputs.region }}"